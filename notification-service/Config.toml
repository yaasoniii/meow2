[dsa612s.notification_service]
servicePort = 8086

[dsa612s.notification_service.messaging]
kafkaBootstrapServers = "kafka:9092"
ordersCreatedTopic = "orders.created"
ordersStatusUpdatedTopic = "orders.status_updated"
paymentsCompletedTopic = "payments.completed"
restaurantStatusTopic = "restaurant.status"
deliveryAssignedTopic = "delivery.assigned"
deliveryCompletedTopic = "delivery.completed"
notificationConsumerGroupId = "notification-service-consumer"

[dsa612s.notification_service.store]
# MongoDB connection. Override mongoUsername/mongoPassword via a Config.toml
# that is NOT committed (or via `-Ckey=value` / secrets) for real deployments.
mongoHost = "mongo"
mongoPort = 27017
mongoDatabase = "notification_service"
mongoUsername = ""
mongoPassword = ""
mongoAuthDatabase = "admin"
