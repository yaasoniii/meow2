services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      # Internal traffic (other services in this compose network) uses "kafka:9092".
      # PLAINTEXT_HOST is for reaching the broker from the host machine, e.g. `bal test`
      # run outside Docker, at "localhost:29092".
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # One-shot: creates every topic in the shared contract (root README) before
  # any service subscribes, so no consumer starts against a missing topic.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in orders.created orders.status_updated payments.completed restaurant.status \
                     delivery.assigned delivery.completed delivery.status_updated; do
          kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1 || exit 1
        done
        echo "Kafka topics ready"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  payment-db:
    image: postgres:16
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
    ports:
      - "5433:5432"
    volumes:
      # Runs once, when the data directory is first initialised.
      - ./payment-service/db_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-service:
    build: ./order-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    ports:
      - "8081:8081"
    restart: unless-stopped
    healthcheck:
      # Healthy once the HTTP port accepts connections (bash is in the JRE image).
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s

  customer-service:
    build: ./customer-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    ports:
      - "8082:8082"
    restart: unless-stopped
    healthcheck:
      # Healthy once the HTTP port accepts connections (bash is in the JRE image).
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8082"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s

  restaurant-service:
    build: ./restaurant-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    ports:
      - "8083:8083"
    restart: unless-stopped
    healthcheck:
      # Healthy once the HTTP port accepts connections (bash is in the JRE image).
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8083"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s

  payment-service:
    build: ./payment-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      payment-db:
        condition: service_healthy
    ports:
      - "8084:8084"
    restart: unless-stopped
    healthcheck:
      # Healthy once the HTTP port accepts connections (bash is in the JRE image).
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8084"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s

  delivery-service:
    build: ./delivery-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    ports:
      - "8085:8085"
    restart: unless-stopped
    healthcheck:
      # Healthy once the HTTP port accepts connections (bash is in the JRE image).
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8085"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s

  notification-service:
    build: ./notification-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    ports:
      - "8086:8086"
    restart: unless-stopped
    healthcheck:
      # Healthy once the HTTP port accepts connections (bash is in the JRE image).
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8086"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s

  admin-service:
    build: ./admin-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    ports:
      - "8087:8087"
    restart: unless-stopped
    healthcheck:
      # Healthy once the HTTP port accepts connections (bash is in the JRE image).
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8087"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s

  # Web UI + reverse proxy: http://localhost:3000. /api/<service>/... is
  # forwarded to that service, so the browser never calls the services directly.
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  mongo-data:
