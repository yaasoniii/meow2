# Serves the static UI and proxies /api/<service>/<path> to http://<service-host>/<path>.
#
# Upstreams are resolved per request through Docker's DNS (resolver + variables)
# instead of at startup, so the UI comes up even while a backend is still
# starting or is down - that service's calls just return 503 until it's back.

map $request_uri $api_upstream {
    ~^/api/order/         order-service:8081;
    ~^/api/customer/      customer-service:8082;
    ~^/api/restaurant/    restaurant-service:8083;
    ~^/api/payment/       payment-service:8084;
    ~^/api/delivery/      delivery-service:8085;
    ~^/api/notification/  notification-service:8086;
    ~^/api/admin/         admin-service:8087;
    default               "";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        if ($api_upstream = "") {
            return 404;
        }
        rewrite ^/api/[^/]+/(.*)$ /$1 break;
        proxy_pass http://$api_upstream$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        error_page 502 503 504 = @service_down;
    }

    location @service_down {
        default_type application/json;
        return 503 '{"message":"Service unavailable - is it running?"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
